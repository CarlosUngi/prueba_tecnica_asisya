name: ASISYA CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build-and-test:
    name: Backend - Build & Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restaurar dependencias de .NET
      run: dotnet restore backend/Asisya.sln

    - name: Compilar Solución del Backend
      run: dotnet build backend/Asisya.sln --no-restore -c Release

    - name: Ejecutar Pruebas Unitarias e Integración
      run: dotnet test backend/Asisya.sln --no-build -c Release --verbosity normal

  frontend-build:
    name: Frontend - Build & Lint (React + TS)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar Node.js (v20)
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Instalar dependencias del Frontend
      run: |
        cd frontend
        npm ci || npm install

    - name: Compilar Frontend (Vite Build)
      run: |
        cd frontend
        npm run build

  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, frontend-build]

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Verificar construcción de imagen Docker (Backend)
      run: docker build -t asisya-backend:latest ./backend

    - name: Verificar construcción de imagen Docker (Frontend)
      run: docker build -t asisya-frontend:latest ./frontend

    - name: Mock - Simular subida a Registry y consultar contenedor
      run: |
        echo "================================================================"
        echo "🔍 Consultando el sistema operativo dentro del contenedor generado..."
        docker run --rm asisya-backend:latest cat /etc/os-release | grep PRETTY_NAME
        echo "================================================================"
        echo "🚀 MOCK: En este paso subiríamos el contenedor a un Google Container Registry (GCR),"
        echo "a su versión en AWS (Elastic Container Registry - ECR), o a Docker Hub."
        echo "Comando teórico: docker push mi-registro/asisya-backend:latest"
        echo "================================================================"
